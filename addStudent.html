<!DOCTYPE html>
<html lang="fr">
    <head>
        <meta charset="UTF-8">
        <title>Presencia/Ajouter un étudiant</title>
        <meta name="viewport" content="width=device-width,initial-scale=1.0">
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
        <link href="addStudent.css" rel="stylesheet">

        

    </head>
    <body>
        <div class="parent">
        <form class="container mt-3 shadow child">
        
            <h2 class="titles">Ajouter un utilisateur</h2>
        <div class="justify-content-center mt-3 choice" >
            <button class="bttn" type="button" data-role="etudiant" onclick="choisirRole(this)">Etudiant</button>
            <button class="bttn" type="button" data-role="prof" onclick="choisirRole(this)">Proffesseur</button>
            <button class="bttn" type="button" data-role="admin" onclick="choisirRole(this)">Administrateur</button>
           
        </div>
        <div class="d-flex gap">
         <div>
            <label class="form-label titles">Nom</label>
            <input class="ipt form-control" type="text" id="name">
         </div>
         <div class="">
            <label class="form-label titles">Prénom</label>
            <input class="ipt form-control ms-3" type="text" id="surname">
         </div> 
        
        </div>
        <div class="d-flex">
           <div>
            <label class="form-label titles">Email</label>
            <input class="ipt form-control" type="email" id="mail">
         </div>
         <div class="">
            <label class="form-label titles">Classe</label>
            <input class="ipt form-control ms-3" type="text" id="cls">
         </div> 
        </div>
        <div class=""> 
           <label class="form-label titles">Mot de passe</label>
            <input class="ipt form-control titles" type="text" id="mtd">
        </div>
        <div class="mt-3 mb-4">
           <button class="btn btn-outline-dark" type="reset">Annuler</button>
           <button class="btn btn-dark" type="button" onclick="addStudent()">Ajouter</button>
        </div>


       </form>
       </div>
       <script src="addStudent.js"></script>
    </body>
</html>
