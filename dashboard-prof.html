<!DOCTYPE html>
<html lang="fr">
    <head>
        <meta charset="UTF-8">
        <title>Dashboard-Prof</title>
        <meta name="viewport" content="width=device-width,initial-scale=1.0">
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">


        <link rel="stylesheet" href="css/dashpro.css">
    </head>
    <body>
        <header>
            <nav class="navbar nav navbar-expand-lg">
             <div class="container"><a class="navbar-brand"><img src="images/itma.jpeg" class="mg"></a></div>
             <div class="container">
            <ul class="navbar-nav d-flex">
                     <li class="navbar-item"><a class="nav-link  text-white" href="dashboard-prof.html">Tableau de bord</a></li>
                     <li class="navbar-item"><a class="nav-link  text-white" href="hist.html">Hist<i class="bi bi-clock-history" ></i>rique de présences</a></li>
                      <li class="navbar-item "><a class="nav-link  text-white" href="déconnexion.html">Déconnexion</a></li>
                </ul>
             </div>
            </nav>
            <h1 class="mt-3">Bienvenue M.<span id="iden"></span>👋🏼</h1>
            
                <select class="mt-3" id="choixCls"> 
                    <option value="IRT1">IRT1</option>
                    <option value="Prepa1">Prepa1</option>
                    <option value="Prepa2">Prepa2</option>
                    <option value="IRT2">IRT2</option>
                    <option value="RIT1">RIT1</option>
                    <option value="GL1">GL1</option>
                </select>
           
            <section class="container card shadow  mt-5">
                <div class="sect container">
                <p >Classe:  <span id="cls"></span></p> 
                <p>Module:  <span  id="mod"></span></p>
                <p >Prof chargé du cours:  <span id="prof"></span></p>
                </div>
            </section>
        </header>
        <main>
        <section class="container card shadow mt-5">
            <p>Qr Code</p>
            <div id="qrcode"></div>
            <P>temps restant:<span id="time">15:00</span></P>
            <div class="d-flex mb-3">
            <button class="btn btn-success me-3" id="icone" onclick="startSession()"></button>
            <button class="btn btn-danger" onclick="stop()">Arreter session</button><br>
            <h3 class="text-center mt-3" id="end"></h3>
            </div>
        </section>
        <section class="container card mt-5  shadow">
            <table class="table table-bordered table-striped">
                <thead>
                  <tr> <th>Nombres d'élèves présents</th>
                       <th>Nombres d'élèves absents</th>
                  </tr>
                       </thead>
                 
                <tbody>
                   <tr><td id="nbPresent">0</td>
                     <td id="nbAbsent">0</td> </tr>
                </tbody>
                </table>
        </section>
        <section class="container card mt-5 shadow">
            <table class="table table-bordered table-striped">
                 <caption class="caption-top text-center">Liste de présences</caption>
                <thead>
                  <tr><th>N°</th>
                        <th>Nom</th>
                        <th>Prénom</th>
                        <th>statut</th></tr>
                        
                    
                </thead>
                <tbody id="tab">
                    
                </tbody>
            </table>
        </section>
        </main>
        <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
        <script src="js/dashboard2.js"></script>
    </body>
</html>
